[package]
name = "deck-pico"
version = "0.1.0"
edition = "2024"

[features]
# Emits the six buttons and both encoder directions on a timer, touching no
# GPIO at all, so the report descriptor can be checked against `evtest`
# before a single switch is wired. Off by default: this is a device that
# presses its own buttons, which is not a thing to ship by accident.
selftest = []

# Reads the pitch fader on GP27 and prints its raw ADC counts over a USB
# serial interface, alongside the running minimum and maximum. A bench
# instrument, not a control path: `docs/hardware.md` records the fader's
# span and its centre detent as *unmeasured*, and this is what measures
# them. Off by default — the shipped deck has no serial port.
faderprobe = []

[dependencies]
cortex-m-rt = "0.7.6"
embassy-executor = { version = "0.10.0", features = ["executor-thread", "platform-cortex-m"] }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.10.0", features = ["rp235xa", "time-driver", "critical-section-impl"] }
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
panic-halt = "1.0.0"
static_cell = "2.1.1"
usbd-hid = "0.10.2"
