[package]
name = "deck-pi"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Bit-perfect single-deck DJ transport"
publish = false

[dependencies]
# Enforcement, not runtime: a global allocator wrapper that makes an
# allocation inside a marked region fail loudly. CLAUDE.md requires the
# callback discipline to hold from the first commit, and this is what turns
# that from intent into a check.
assert_no_alloc = { version = "1.1", default-features = false, features = [
  "warn_release",
] }

# Linux only: the deck's real output. On macOS the sink is `CaptureSink`, so
# the file layer, ring, transport and callback all stay buildable and testable
# off the target.
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.12"
alsa-sys = "0.6"
# `mlockall`, `sched_setscheduler` and `sched_setaffinity`, plus the read-backs
# that check they took. `thread-priority` is the crate `implementation.md`
# named for the SCHED_FIFO half, but two of the three calls are not in it and
# the verification needs the raw ones anyway — so this is one dependency
# instead of two. See `src/rt.rs`.
libc = "0.2"

[build-dependencies]
pkg-config = "0.3"

[profile.release]
# The audio callback must not be surprised by codegen; keep it inspectable.
debug = 1
overflow-checks = true
