[package]
name = "deck-pi"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Bit-perfect single-deck DJ transport"
publish = false

[dependencies]
# Enforcement, not runtime: a global allocator wrapper that makes an
# allocation inside a marked region fail loudly. CLAUDE.md requires the
# callback discipline to hold from the first commit, and this is what turns
# that from intent into a check.
assert_no_alloc = { version = "1.1", default-features = false, features = [
  "warn_release",
] }
# East Asian Width, for the display's column arithmetic. A cell in the panel
# fonts holds one kanji or two ASCII characters, so "how wide is this name"
# is a Unicode property rather than a `chars().count()`. Hand-rolling the
# ranges would be a table that goes stale against the standard.
unicode-width = "0.2.2"
# Compatibility decomposition, for the display's ASCII fallback. `é` is `e`
# plus a combining acute, and `…` is three full stops — so "what would this
# character be without the part the panel font lacks" is a Unicode property
# too, and the same argument as `unicode-width` above applies: the table is
# large, it grows, and a hand-kept copy of a slice of it goes stale silently.
# Measured need, not a precaution: 87 of the 2192 names on the stick contain a
# character neither panel face has, and 23 of the 32 distinct ones are
# accented Latin. See `src/display/paint.rs`.
unicode-normalization = "0.1"
# The drawing half of the display. `embedded-graphics` is the one drawing API
# behind a `DrawTarget`, and `decisions.md` (2026-09-15, the panel moving to
# the Pico) is what puts it in the deck rather than in firmware: "the deck
# still draws", so fonts and layout stay here and the `DrawTarget` impl will
# target a USB packer instead of an SPI driver.
#
# `tools/panel-compare/Cargo.toml` says it was kept a separate crate so these
# never became deck dependencies. That held while nothing in the deck drew;
# the reversal overrides it. `image` is **not** followed in here — the tests
# render into a `Vec` of pixels, which is all a pixel assertion needs.
embedded-graphics = "0.8"
# The 12 and 16 px Japanese faces, which are efont/shinonome and Public
# Domain in their Japanese sources — traced in
# [#10](https://github.com/tamatebox/deck-pi/issues/10), which is also why
# `b10_t_japanese*` is not used: naga10, "freely usable but restricted", and
# unread. One checkbox in #10 is open and must close before anything ships.
u8g2-fonts = "0.8"

# Linux only: the deck's real output. On macOS the sink is `CaptureSink`, so
# the file layer, ring, transport and callback all stay buildable and testable
# off the target.
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.12"
alsa-sys = "0.6"
# `mlockall`, `sched_setscheduler` and `sched_setaffinity`, plus the read-backs
# that check they took. `thread-priority` is the crate `implementation.md`
# named for the SCHED_FIFO half, but two of the three calls are not in it and
# the verification needs the raw ones anyway — so this is one dependency
# instead of two. See `src/rt.rs`.
libc = "0.2"

[build-dependencies]
pkg-config = "0.3"

[profile.release]
# The audio callback must not be surprised by codegen; keep it inspectable.
debug = 1
# On, deliberately, and not the default. A wrapped index reads the wrong part
# of the ring and emits plausible wrong audio; a checked overflow stops the
# deck loudly. See `docs/implementation.md`, which also says why this does
# *not* weaken the callback's "cannot fault" invariant — that one is about
# page faults, and a panic is not one.
overflow-checks = true
