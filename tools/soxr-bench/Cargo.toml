[package]
name = "soxr-bench"
version = "0.1.0"
edition = "2021"
publish = false

# A measurement harness for issue #3, NOT deck code. v1 has no resampler, so
# libsoxr must not become a dependency of the thing that has to meet a
# deadline; keeping this outside the deck's crate is what guarantees that.
#
# What it answers: precision x source rate, for realtime ratio *and* worst-case
# block time, on the board the deck actually runs on. A run started from cold
# measures a clock the board will not hold, so this reports die temperature and
# ARM clock beside every row and the reader takes the soaked ones. Written for a
# 3B+ and its 60 C soft limit; the deck is on a Pi 4 now and the soak still
# earns its place — see the module doc.

[dependencies]

[build-dependencies]
pkg-config = "0.3"
